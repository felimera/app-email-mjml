spring.application.name=app-email-mjml

# ========================================
# CONFIGURACIÓN DE BASE DE DATOS H2
# ========================================
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true

# Desactivar que Hibernate cree las tablas automáticamente (usamos schema.sql)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=true

# Configuración para que Spring Boot ejecute los scripts SQL en orden y con UTF-8
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8

# ========================================
# CONFIGURACIÓN DE CORREO (SMTP)
# ========================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Personalizar la ruta de la interfaz de Swagger UI (Opcional)
springdoc.swagger-ui.path=/swagger-ui.html

# Información de la API
springdoc.api-docs.path=/v3/api-docs

# Cambiar el prefijo por defecto de Thymeleaf para apuntar a otra carpeta
spring.thymeleaf.prefix=classpath:/mail-templates/

logging.level.org.springdoc=DEBUG